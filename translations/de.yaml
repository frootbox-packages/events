# German texts of the events: labels of the blocks, texts for visitors and the screens (decisions 0161, 0227).
"Events": "Termine"
"Next events": "Nächste Termine"
"The upcoming events from the next one on, page by page and by category, and the past ones on request. Each event gets its own address below the first page with this block; there the block shows the event with its place, a map and a file for the calendar.": "Die kommenden Termine ab dem nächsten, Seite für Seite und nach Kategorie, auf Wunsch auch die vergangenen. Jeder Termin bekommt eine eigene Adresse unter der ersten Seite mit diesem Block; dort zeigt der Block den Termin mit Ort, Karte und einer Datei für den Kalender."
"The next events, e.g. on the start page, with a link to all of them.": "Die nächsten Termine, z. B. auf der Startseite, mit einem Link auf alle."
"Events per page": "Termine pro Seite"
"Images in the list": "Bilder in der Liste"
"Filter by category": "Nach Kategorie filtern"
"Link to past events": "Link auf vergangene Termine"
"Map of the place": "Karte des Orts"
"Without a map": "Ohne Karte"
"Number of events": "Anzahl der Termine"
"Heading": "Überschrift"
# Website
"All": "Alle"
"All events": "Alle Termine"
"Add to calendar": "In den Kalender eintragen"
"Categories": "Kategorien"
"Map": "Karte"
"Upcoming events": "Kommende Termine"
"Past events": "Vergangene Termine"
"Past events, the latest first.": "Vergangene Termine, die letzten zuerst."
"No events match this choice.": "Zu dieser Auswahl gibt es keine Termine."
"No upcoming events.": "Zurzeit stehen keine Termine an."
"No past events.": "Noch keine vergangenen Termine."
"Previous page": "Vorige Seite"
"Next page": "Nächste Seite"
"Page {page} of {pages}": "Seite {page} von {pages}"
"Pages": "Seiten"
# Backend (decisions 0220, 0227)
"New event": "Neuer Termin"
"Courses, concerts, open days: anything with a date and a place.": "Kurse, Konzerte, Tage der offenen Tür: alles mit Datum und Ort."
"No events yet": "Noch keine Termine"
"Create the first one. It stays a draft until you publish it.": "Leg den ersten an. Er bleibt ein Entwurf, bis Du ihn veröffentlichst."
"Without a title": "Ohne Titel"
"Newer": "Neuere"
"Older": "Ältere"
"Save as a draft": "Als Entwurf speichern"
"The event is saved as a draft.": "Der Termin ist als Entwurf gespeichert."
"The event is published.": "Der Termin ist veröffentlicht."
"Visitors in this language do not see the event.": "Besucher in dieser Sprache sehen den Termin nicht."
"The event goes offline by itself.": "Der Termin geht von selbst offline."
"Only for a published event.": "Nur für einen veröffentlichten Termin."
"Delete the event": "Termin löschen"
"Your changes to this event are lost. The published version stays.": "Deine Änderungen an diesem Termin gehen verloren. Die veröffentlichte Fassung bleibt."
"The event was never published and is gone afterwards.": "Der Termin war nie veröffentlicht und ist danach weg."
"The event is offline.": "Der Termin ist offline."
"Visitors no longer find the event. It stays as a draft and can be published again.": "Besucher finden den Termin nicht mehr. Er bleibt als Entwurf und lässt sich wieder veröffentlichen."
"The event is deleted.": "Der Termin ist gelöscht."
"The event leaves the list and the website. Visitors no longer find it.": "Der Termin verschwindet aus der Liste und von der Website. Besucher finden ihn nicht mehr."
"The last part of the address of the event. If it changes, the old one redirects to the new one.": "Der letzte Teil der Adresse des Termins. Ändert er sich, leitet die alte Adresse auf die neue weiter."
"Teaser": "Anriss"
"A few sentences for the list and for search engines.": "Ein paar Sätze für die Liste und für Suchmaschinen."
"Venue": "Veranstaltungsort"
"Where it takes place, e.g. \"Roastery\".": "Wo er stattfindet, z. B. „Rösterei“."
"Begins": "Beginn"
"Ends": "Ende"
"Left empty if the end is open.": "Leer lassen, wenn das Ende offen ist."
"All day long": "Ganztägig"
"Only the days count, the times are not shown.": "Nur die Tage zählen, Uhrzeiten werden nicht gezeigt."
"Street and town": "Anschrift"
"In one line, e.g. \"Hafenstraße 12, 20457 Hamburg\".": "In einer Zeile, z. B. „Hafenstraße 12, 20457 Hamburg“."
"Coordinates": "Koordinaten"
"Latitude and longitude for the map, e.g. \"53.5444, 9.9663\". Copy them from a map.": "Breite und Länge für die Karte, z. B. „53.5444, 9.9663“. Kopier sie aus einer Karte."
"Topics of the events, such as courses or concerts. Visitors can filter the list by them.": "Themen der Termine, etwa Kurse oder Konzerte. Besucher können die Liste danach filtern."
"Used in the filter of the list, e.g. ?category=courses.": "Steht im Filter der Liste, z. B. ?category=kurse."
"Delete {title}": "{title} löschen"
"The category is deleted.": "Die Kategorie ist gelöscht."
"The events stay, they just lose this category.": "Die Termine bleiben, sie verlieren nur diese Kategorie."
"No categories yet": "Noch keine Kategorien"
"Events do not need one. Create categories if visitors should filter by topic.": "Termine brauchen keine. Leg Kategorien an, wenn Besucher nach Themen filtern sollen."
"New category": "Neue Kategorie"
"The category is created.": "Die Kategorie ist angelegt."
"Create the category": "Kategorie anlegen"
