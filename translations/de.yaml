"Where it takes place, e.g. \"Roastery\".": "Wo er stattfindet, z. B. „Rösterei“."
"Begins": "Beginn"
"Ends": "Ende"
"Left empty if the end is open.": "Leer lassen, wenn das Ende offen ist."
"All day long": "Ganztägig"
"Only the days count, the times are not shown.": "Nur die Tage zählen, Uhrzeiten werden nicht gezeigt."
