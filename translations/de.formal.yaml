# German texts of the events for visitors addressed formally ("Sie"),
# only those that differ from de.yaml (decisions 0316, 0351).
"Please choose a date of a course first.": "Bitte wählen Sie zuerst einen Kurstermin."
"Your details": "Ihre Angaben"
"Leave the names empty if you take part yourself.": "Lassen Sie die Namen leer, wenn Sie selbst teilnehmen."
"Please also note:": "Bitte beachten Sie auch:"
"Please check your entries.": "Bitte prüfen Sie Ihre Angaben."
"Thank you for your booking {number}. A confirmation is on its way by email.": "Vielen Dank für Ihre Anmeldung {number}. Eine Bestätigung kommt per E-Mail."
"Thank you for your booking. A confirmation is on its way by email.": "Vielen Dank für Ihre Anmeldung. Eine Bestätigung kommt per E-Mail."
"Please agree to “{title}”.": "Bitte stimmen Sie „{title}“ zu."
"Please fill in this field.": "Bitte füllen Sie dieses Feld aus."
"Please enter an email address, e.g. name@example.com.": "Bitte geben Sie eine E-Mail-Adresse ein, z. B. name@example.com."
"Please enter a phone number.": "Bitte geben Sie eine Telefonnummer ein."
"Please enter a date.": "Bitte geben Sie ein Datum ein."
"Please choose one of the options.": "Bitte wählen Sie eine der Möglichkeiten."
"Please check this box.": "Bitte setzen Sie diesen Haken."
"Please write at most {count} characters.": "Bitte schreiben Sie höchstens {count} Zeichen."
"The price has changed meanwhile. Please check the booking and send it again.": "Der Preis hat sich inzwischen geändert. Bitte prüfen Sie die Anmeldung und schicken Sie sie noch einmal ab."
"The courses cannot be reached right now. Please try again in a moment.": "Die Kurse sind gerade nicht erreichbar. Bitte versuchen Sie es gleich noch einmal."
